# Configuración de Nginx para https://control-acceso.sudamericano.edu.ec
#
# Sirve el panel React (build estático de "npm run build", carpeta
# frontend/dist/) en la raíz, y manda todo lo que empiece con /api/ al
# backend FastAPI (que corre localmente en el servidor, puerto 8000,
# manejado por el servicio systemd control-acceso-backend.service --
# ver ese archivo en esta misma carpeta).
#
# Instalación (ajusta las rutas si el proyecto queda en otro lugar):
#
#   sudo cp deploy/nginx-control-acceso.conf /etc/nginx/sites-available/control-acceso
#   sudo ln -s /etc/nginx/sites-available/control-acceso /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificado TLS (Let's Encrypt, gratis) -- después de que el DNS del
# subdominio ya apunte a este servidor:
#
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d control-acceso.sudamericano.edu.ec
#
# certbot reescribe este archivo solo para agregar los bloques de TLS
# (listen 443, ssl_certificate, y el redirect de 80->443) -- no hace
# falta tocarlos a mano.

# Límite de intentos de login por IP (freno básico a la fuerza bruta de
# contraseñas). Va FUERA del bloque server (contexto http): los archivos de
# sites-enabled se incluyen dentro de http {}.
limit_req_zone $binary_remote_addr zone=control_acceso_login:10m rate=10r/m;

server {
    listen 80;
    server_name control-acceso.sudamericano.edu.ec;

    # Panel React (build estático)
    root /var/www/control-acceso/frontend/dist;
    index index.html;

    # Nada de subir archivos: la API solo recibe JSON pequeño.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # OJO: en Nginx, un add_header dentro de un location REEMPLAZA a los del
    # bloque server (no se suman). Por eso las dos cabeceras de seguridad se
    # repiten en los location que definen su propio add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # SPA de React Router: cualquier ruta que no sea un archivo real
    # (ej. /reportes, /personas) debe devolver index.html para que React
    # Router la maneje del lado del cliente -- si no, recargar la página
    # en una de esas rutas da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html NUNCA debe quedar en la caché del navegador: en cada
    # despliegue apunta a archivos nuevos (con otro hash en el nombre). Si el
    # navegador conservara el index.html viejo, pediría archivos que ya no
    # existen y el panel quedaría en blanco hasta borrar la caché.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Los archivos de /assets llevan un hash en el nombre (Vite): cambian de
    # nombre cuando cambian de contenido, así que se pueden cachear por mucho
    # tiempo sin riesgo.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Login: mismo proxy que /api/, más el límite de intentos por IP.
    location = /api/login {
        limit_req zone=control_acceso_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API (FastAPI/Uvicorn corriendo en localhost:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los PDF de reportes pueden tardar unos segundos en generarse en
    # instituciones con muchos registros -- sin esto, Nginx puede cortar
    # la respuesta antes de que termine.
    location /api/reportes/pdf {
        proxy_pass http://127.0.0.1:8000/api/reportes/pdf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
